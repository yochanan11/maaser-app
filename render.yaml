services:
  - type: web
    name: maaser
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SCHEMA
        value: maaser
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false

services:
  - type: web
    name: maaser
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: maaser-db
          property: connectionString
databases:
  - name: maaser-db
    plan: free
